[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stitch-seg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9, <=3.13"
dependencies = [
    "albumentations>=1.4.18",
    "av>=12.3.0",
    "decord>=0.6.0",
    "easydict>=1.13",
    "einops>=0.8.1",
    "fastexcel>=0.12.1",
    "imageio>=2.35.1",
    "imageio-ffmpeg>=0.5.1",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "kaleido==0.2.1",
    "kornia>=0.7.3",
    "matplotlib>=3.7.5",
    "nvtx>=0.2.14",
    "onnx>=1.19.1",
    "onnxconverter-common>=1.16.0",
    "onnxruntime-gpu",
    "onnxscript>=0.6.0",
    "onnxsim-prebuilt",
    "pandas>=2.0.3",
    "pillow>=10.4.0",
    "polars>=1.8.2",
    "ptlflow>=0.4.1",
    "pyinstrument>=5.1.1",
    "scikit-image>=0.21.0",
    "scipy>=1.10.1",
    "segmentation-models-pytorch>=0.3.3",
    "setuptools>=75.3.2",
    "tensorrt>=10.15.1.29",
    "timm>=0.9.2",
    "torch",
    "torchvision>=0.19.1",
    "transformers>=4.46.3",
    "xformers>=0.0.28.post1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["stitch_seg*"]